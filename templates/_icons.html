{% macro icon(name) -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'home' -%}

{%- elif name == 'office' -%}
  <path d="M3 21h18"/><path d="M5 21V4a1 1 0 0 1 1-1h7a1 1 0 0 1 1 1v17"/>
  <path d="M14 9h5a1 1 0 0 1 1 1v11"/><path d="M8 7h3M8 11h3M8 15h3M17 13h0M17 17h0"/>
{%- elif name == 'drop' -%}

  <path d="M9 14.5a3 3 0 0 0 3 3"/>
{%- elif name == 'sparkle' -%}

{%- elif name == 'shield' -%}

{%- elif name == 'bug' -%}
  <path d="M8 8a4 4 0 0 1 8 0"/><rect x="7" y="8" width="10" height="11" rx="5"/>
  <path d="M3 12h4M17 12h4M4 7l3 2M20 7l-3 2M4 18l3-2M20 18l-3-2M9 5.5 7.6 4M15 5.5 16.4 4"/>
{%- elif name == 'spray' -%}
  <path d="M9 8h6a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2Z"/>
  <path d="M10 8V5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v3"/><path d="M17 6h2M19 3h0M20.5 8.5h0M17 10h2"/>
  <path d="M10 13h4"/>
{%- elif name == 'phone' -%}
  <path d="M6.2 3.5h3l1.5 4-2 1.3a12 12 0 0 0 5.5 5.5l1.3-2 4 1.5v3a2 2 0 0 1-2.2 2A16.5 16.5 0 0 1 4.2 5.7 2 2 0 0 1 6.2 3.5Z"/>
{%- elif name == 'whatsapp' -%}

  <path d="M9 9c0 3 3 6 6 6 1.5 0 1.5-2 1.5-2l-2-.8-1 1a6 6 0 0 1-2.7-2.7l1-1L11 7.5S9 7.5 9 9Z"/>
{%- elif name == 'mail' -%}
  <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6.5 8.5 6 8.5-6"/>
{%- elif name == 'pin' -%}
  <path d="M12 21s7-5.7 7-11a7 7 0 1 0-14 0c0 5.3 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/>
{%- elif name == 'clock' -%}

{%- elif name == 'check' -%}
  <path d="m5 13 4 4L19 7"/>
{%- elif name == 'star' -%}

{%- elif name == 'chevron' -%}
  <path d="m6 9 6 6 6-6"/>
{%- elif name == 'menu' -%}
  <path d="M3 6h18M3 12h18M3 18h18"/>
{%- elif name == 'close' -%}
  <path d="M6 6l12 12M18 6 6 18"/>
{%- elif name == 'arrow' -%}
  <path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == 'back' -%}
  <path d="M19 12H5M11 6l-6 6 6 6"/>
{%- elif name == 'user' -%}
  <circle cx="12" cy="8" r="3.5"/><path d="M4.5 21a7.5 7.5 0 0 1 15 0"/>
{%- elif name == 'users' -%}
  <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
  <path d="M22 21v-2a4 4 0 0 0-3-3.9"/>
{%- elif name == 'award' -%}
  <circle cx="12" cy="9" r="6"/><path d="m8.5 14-1.5 7 5-2.6 5 2.6-1.5-7"/>
{%- elif name == 'calendar' -%}
  <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>
{%- elif name == 'clipboard' -%}
  <rect x="5" y="4" width="14" height="17" rx="2"/>
  <path d="M9 4.5A1.5 1.5 0 0 1 10.5 3h3A1.5 1.5 0 0 1 15 4.5V6H9Z"/><path d="M9 11h6M9 15h4"/>
{%- elif name == 'smile' -%}
  <circle cx="12" cy="12" r="9"/><path d="M8.5 14a4.5 4.5 0 0 0 7 0"/><path d="M9 9.5h.01M15 9.5h.01"/>
{%- elif name == 'leaf' -%}
  <path d="M4 20c0-8 5-14 16-14 0 10-6 14-12 14a4 4 0 0 1-4-4Z"/><path d="M4 20c2-6 6-9 10-10.5"/>
{%- elif name == 'grid' -%}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'gear' -%}
  <circle cx="12" cy="12" r="3"/>
  <path d="M19.1 14.4a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8v0a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/>
{%- elif name == 'logout' -%}
  <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'edit' -%}
  <path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
{%- elif name == 'trash' -%}
  <path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>
{%- elif name == 'plus' -%}
  <path d="M12 5v14M5 12h14"/>
{%- elif name == 'search' -%}
  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
{%- elif name == 'image' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/>
  <path d="m4 17 5-4 4 3 3-2 4 3"/>
{%- elif name == 'facebook' -%}
  <path d="M14 8.5V7a1.5 1.5 0 0 1 1.5-1.5H17V3h-2a4 4 0 0 0-4 4v1.5H9V11h2v10h3V11h2.2l.4-2.5H14Z"/>
{%- elif name == 'instagram' -%}
  <rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><path d="M17.5 6.5h.01"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro stars(count) -%}
  {% for i in range(count|int) %}
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
      <path d="m12 3.2 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.7l6.1-.9Z"/>
    </svg>
  {% endfor %}
{%- endmacro %}
